<div class="form-label-group">
        <div class="form-floating mb-2">
          <input [ngClass]="(controlDir && controlDir.control 
            && !controlDir.control.touched) ? !controlDir.control.valid ? 'is-invalid' : 'is-valid' : null"
          [type]="type" (input)="onChange($event.target.value)"
            (blur)="onTouched()" id="{{label}}"#input 
            class="form-control"  placeholder="{{label}}" />
          <label for="{{label}}">{{label}}</label>
          @if (controlDir && controlDir.control && !controlDir.control.valid && !controlDir.control.touched) {
            <div class="invalid-feedback">
                @if (controlDir.control.errors?.['required']) {
                    <span>{{label}} is required</span>
                }
                <!-- @if (controlDir.control?.hasError('email')) {
                    <span>Invalid email address</span>
                } -->
            </div>
          }
        </div>
</div>
